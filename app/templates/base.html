<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  {% if user %}
  <header class="top">
    <a class="brand" href="/">
      <span class="mark" aria-hidden="true"></span>
      <span>{{ app_name }}</span>
    </a>
    <nav>
      <a href="/" class="{% if nav == 'notes' %}active{% endif %}">Notes</a>
      <a href="/setup" class="{% if nav == 'setup' %}active{% endif %}">Setup</a>
      <a href="/settings" class="{% if nav == 'settings' %}active{% endif %}">Settings</a>
    </nav>
    <div class="who">
      <span>{{ user.name or user.email }}</span>
      <a class="quiet" href="/auth/logout">Logout</a>
    </div>
  </header>
  {% endif %}
  <main class="{% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
