<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css?v=8">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("vp-theme") || "night";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body class="{% block body_class %}{% endblock %}">
  {% if user %}
  <header class="top">
    <a class="brand" href="/">
      <span class="mark" aria-hidden="true"></span>
      <span>{{ app_name }}</span>
    </a>
    <nav>
      <a href="/" class="{% if nav == 'notes' %}active{% endif %}">Notes <span id="live-badge" class="live-badge" hidden></span></a>
      <a href="/setup" class="{% if nav == 'setup' %}active{% endif %}">Setup</a>
      <a href="/settings" class="{% if nav == 'settings' %}active{% endif %}">Settings</a>
    </nav>
    <div class="who">
      <div class="theme-pick" data-theme-pick role="group" aria-label="Color mode">
        <button type="button" data-theme="night" title="Night"></button>
        <button type="button" data-theme="light" title="Light"></button>
        <button type="button" data-theme="dusk" title="Dusk"></button>
        <button type="button" data-theme="forest" title="Forest"></button>
      </div>
      <span>{{ user.name or user.email }}</span>
      <a class="quiet" href="/auth/logout">Logout</a>
    </div>
  </header>
  {% endif %}
  <main class="{% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="/static/app.js?v=8"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
